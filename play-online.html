  <h1>線上對戰</h1>
  <p>
    一人建立戰局拿到房號，另一人輸入房號加入。開局自動擲硬幣決定發球權，每回合有 15 秒參考倒數(目前只顯示，還不會自動放棄)。
    角色技能一樣用手動加減值輔助套用。<b style="color:var(--chalk)">對戰途中請不要重新整理分頁</b>，手牌只存在自己瀏覽器記憶體，重整會遺失。
  </p>
