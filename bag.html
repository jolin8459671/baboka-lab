<section class="page-hero">
  <div class="section__kicker">Card bag</div>
  <h1>卡牌背包</h1>
  <p>從抽卡包實際拿到的每一張卡都會進到這裡，同一張抽到幾張就疊幾張（右下角數字）。之後組牌組會從這份清單挑牌。收藏存在資料庫裡，換裝置也不會不見。</p>
</section>

<section class="section" style="padding-top:0;">
  <div class="bracket statbar" id="bagstat">連線中…</div>

  <div class="dbtools">
    <input type="text" id="q" placeholder="搜尋卡名 / 卡號 / 技能關鍵字…">
    <select id="fType">
      <option value="">全部類型</option>
      <option value="character">角色卡</option>
      <option value="event">事件卡</option>
    </select>
    <select id="fSeries"><option value="">全部系列</option></select>
    <select id="fTeam"><option value="">全部學校</option></select>
    <select id="fRarity"><option value="">全部稀有度</option></select>
    <select id="fSort">
      <option value="series">依系列排序</option>
      <option value="count">依張數排序</option>
      <option value="rarity">依稀有度排序</option>
    </select>
  </div>

  <div class="dexgrid" id="grid"></div>
  <div class="emptystate" id="empty">背包裡還沒有符合條件的卡，先去<a href="packs.html" style="color:var(--score);">抽卡包</a>吧。</div>
</section>
