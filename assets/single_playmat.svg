<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="55%" stop-color="#1c1a18"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2622"/>
      <stop offset="100%" stop-color="#1c1815"/>
    </linearGradient>
    <linearGradient id="receiveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a52"/>
      <stop offset="100%" stop-color="#152a3d"/>
    </linearGradient>
    <linearGradient id="tossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f4230"/>
      <stop offset="100%" stop-color="#173324"/>
    </linearGradient>
    <linearGradient id="attackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a1f1c"/>
      <stop offset="100%" stop-color="#3a1815"/>
    </linearGradient>
    <linearGradient id="serveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3a12"/>
      <stop offset="100%" stop-color="#3a2d0d"/>
    </linearGradient>
    <linearGradient id="utilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232019"/>
      <stop offset="100%" stop-color="#1a1815"/>
    </linearGradient>
    <pattern id="courtDots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2b2823"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect x="0" y="0" width="1200" height="700" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="700" fill="url(#courtDots)"/>
  <polygon points="0,0 220,0 0,190" fill="#ff7a1a" opacity="0.10"/>
  <polygon points="1200,700 980,700 1200,510" fill="#ff7a1a" opacity="0.10"/>
  <polygon points="1200,0 1200,150 1080,0" fill="#ffffff" opacity="0.04"/>
  <polygon points="0,700 0,560 130,700" fill="#ffffff" opacity="0.04"/>

  <rect x="10" y="10" width="1180" height="680" rx="14" fill="none" stroke="#ff7a1a" stroke-width="3" opacity="0.55"/>

  <g font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei',sans-serif">

    <!-- ============ NET EDGE INDICATOR (top) ============ -->
    <rect x="30" y="20" width="1140" height="10" fill="url(#blockGrad)"/>
    <rect x="30" y="20" width="1140" height="4" fill="#ff9d4d"/>
    <g font-size="12" fill="#ff9d4d" letter-spacing="4">
      <text x="600" y="16" text-anchor="middle">◤ 這一側朝向球網 / 面對對手 ◢ NET SIDE ◢</text>
    </g>

    <!-- ============ LEFT COLUMN: DECK / SET / LEGEND ============ -->
    <g transform="translate(30,40)">
      <!-- 牌組區 -->
      <rect x="0" y="0" width="110" height="230" rx="10" fill="url(#utilGrad)" stroke="#6b6258" stroke-width="2"/>
      <text x="55" y="26" text-anchor="middle" fill="#e8b784" font-size="16" font-weight="700">牌組區</text>
      <text x="55" y="42" text-anchor="middle" fill="#7a746a" font-size="9" letter-spacing="1.5">DECK</text>
      <rect x="28" y="60" width="54" height="150" rx="6" fill="#241f19" stroke="#8a7f6f" stroke-width="1.3"/>
      <rect x="24" y="56" width="54" height="150" rx="6" fill="#1e1a15" stroke="#ff9d4d" stroke-width="1.5"/>
      <circle cx="51" cy="131" r="16" fill="none" stroke="#ff9d4d" stroke-width="1.2" opacity="0.6"/>

      <!-- 局數區 SET — 兩張卡直立上下疊放,比例貼近真實卡牌(63:88) -->
      <rect x="0" y="245" width="110" height="365" rx="10" fill="url(#utilGrad)" stroke="#6b6258" stroke-width="2"/>
      <text x="55" y="268" text-anchor="middle" fill="#e8b784" font-size="15" font-weight="700">局數區</text>
      <text x="55" y="283" text-anchor="middle" fill="#7a746a" font-size="9" letter-spacing="1.5">SET ×2</text>
      <rect x="18" y="298" width="74" height="104" rx="6" fill="#1e1a15" stroke="#8a7f6f" stroke-width="1.3" stroke-dasharray="3 3"/>
      <rect x="18" y="412" width="74" height="104" rx="6" fill="#1e1a15" stroke="#8a7f6f" stroke-width="1.3" stroke-dasharray="3 3"/>
      <text x="55" y="536" text-anchor="middle" fill="#5a554d" font-size="8" letter-spacing="1">卡牌尺寸比例參考</text>
      <text x="55" y="548" text-anchor="middle" fill="#5a554d" font-size="8" letter-spacing="1">(63 × 88mm)</text>
    </g>

    <!-- ============ RIGHT COLUMN: DECK OVERFLOW / DROP(單一) / 圖示對照表 ============ -->
    <g transform="translate(1060,40)">
      <!-- 棄牌區 DROP(單一區) -->
      <rect x="0" y="0" width="110" height="290" rx="10" fill="#1c1815" stroke="#6b6258" stroke-width="2"/>
      <text x="55" y="26" text-anchor="middle" fill="#e8b784" font-size="16" font-weight="700">棄牌區</text>
      <text x="55" y="42" text-anchor="middle" fill="#7a746a" font-size="9" letter-spacing="1.5">DROP</text>
      <rect x="24" y="58" width="62" height="90" rx="6" fill="none" stroke="#4a453d" stroke-width="1.5" stroke-dasharray="4 3"/>
      <rect x="20" y="54" width="62" height="90" rx="6" fill="none" stroke="#5a554d" stroke-width="1.3" stroke-dasharray="4 3"/>
      <text x="55" y="270" text-anchor="middle" fill="#5a554d" font-size="8" letter-spacing="1">角色卡／事件卡共用</text>

      <!-- 圖示對照表 legend -->
      <rect x="0" y="305" width="110" height="305" rx="10" fill="#100e0c" stroke="#4a453d" stroke-width="2"/>
      <text x="55" y="327" text-anchor="middle" fill="#c9c2b6" font-size="13" font-weight="700">時機圖示</text>
      <text x="55" y="341" text-anchor="middle" fill="#6a655c" font-size="8" letter-spacing="1">ICON GUIDE</text>
      <g font-size="10" fill="#c9c2b6">
        <rect x="14" y="353" width="14" height="14" rx="3" fill="#8a5ccf"/>
        <text x="34" y="364">抽牌 Draw</text>
        <rect x="14" y="378" width="14" height="14" rx="3" fill="#e0553e"/>
        <text x="34" y="389">發球 Serve</text>
        <rect x="14" y="403" width="14" height="14" rx="3" fill="#3d4a52"/>
        <text x="34" y="414">阻擋 Block</text>
        <rect x="14" y="428" width="14" height="14" rx="3" fill="#3372a6"/>
        <text x="34" y="439">接球 Receive</text>
        <rect x="14" y="453" width="14" height="14" rx="3" fill="#3d8a53"/>
        <text x="34" y="464">舉球 Toss</text>
        <rect x="14" y="478" width="14" height="14" rx="3" fill="#c94f3a"/>
        <text x="34" y="489">攻擊 Attack</text>
      </g>
      <text x="55" y="590" text-anchor="middle" fill="#5a554d" font-size="8" letter-spacing="1">符合圖示時機才能使用手牌事件卡</text>
    </g>

    <!-- ============ TOP ROW: BLOCK (near net) ============ -->
    <g transform="translate(155,40)">
      <rect x="0" y="0" width="890" height="180" rx="10" fill="url(#blockGrad)" stroke="#ff7a1a" stroke-width="2.5"/>
      <!-- 副攔 -->
      <rect x="20" y="18" width="260" height="120" rx="8" fill="#181512" stroke="#5a554d" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="150" y="45" text-anchor="middle" fill="#9a9186" font-size="14">副攔　SIDE</text>
      <!-- 主攔 -->
      <rect x="315" y="10" width="260" height="128" rx="8" fill="#181512" stroke="#ff9d4d" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="445" y="38" text-anchor="middle" fill="#ffb347" font-size="14" font-weight="700">主攔　CENTER</text>
      <!-- 副攔 -->
      <rect x="610" y="18" width="260" height="120" rx="8" fill="#181512" stroke="#5a554d" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="740" y="45" text-anchor="middle" fill="#9a9186" font-size="14">副攔　SIDE</text>

      <text x="445" y="163" text-anchor="middle" fill="#ff9d4d" font-size="24" font-weight="800" letter-spacing="6">阻　擋　區　BLOCK</text>
    </g>

    <!-- ============ MIDDLE ROW: RECEIVE / TOSS / ATTACK ============ -->
    <g transform="translate(155,235)">
      <!-- RECEIVE -->
      <g>
        <rect x="0" y="0" width="285" height="230" rx="10" fill="url(#receiveGrad)" stroke="#4a90c4" stroke-width="2.5"/>
        <rect x="100" y="18" width="85" height="60" rx="8" fill="none" stroke="#7ab4de" stroke-width="1.5" opacity="0.6"/>
        <rect x="55" y="90" width="175" height="105" rx="8" fill="#0f1c26" stroke="#4a90c4" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="142" y="210" text-anchor="middle" fill="#7ab4de" font-size="22" font-weight="800" letter-spacing="6">接球區</text>
        <text x="142" y="226" text-anchor="middle" fill="#5a89a8" font-size="11" letter-spacing="3">RECEIVE</text>
      </g>
      <!-- TOSS -->
      <g transform="translate(302,0)">
        <rect x="0" y="0" width="285" height="230" rx="10" fill="url(#tossGrad)" stroke="#4fae6e" stroke-width="2.5"/>
        <rect x="100" y="18" width="85" height="60" rx="8" fill="none" stroke="#7dd39a" stroke-width="1.5" opacity="0.6"/>
        <rect x="55" y="90" width="175" height="105" rx="8" fill="#0f2417" stroke="#4fae6e" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="142" y="210" text-anchor="middle" fill="#7dd39a" font-size="22" font-weight="800" letter-spacing="6">舉球區</text>
        <text x="142" y="226" text-anchor="middle" fill="#5a9a70" font-size="11" letter-spacing="3">TOSS</text>
      </g>
      <!-- ATTACK -->
      <g transform="translate(604,0)">
        <rect x="0" y="0" width="286" height="230" rx="10" fill="url(#attackGrad)" stroke="#e2593f" stroke-width="2.5"/>
        <rect x="100" y="18" width="85" height="60" rx="8" fill="none" stroke="#ff9d80" stroke-width="1.5" opacity="0.6"/>
        <rect x="55" y="90" width="175" height="105" rx="8" fill="#2a120e" stroke="#e2593f" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="143" y="210" text-anchor="middle" fill="#ff9d80" font-size="22" font-weight="800" letter-spacing="6">攻擊區</text>
        <text x="143" y="226" text-anchor="middle" fill="#c96a54" font-size="11" letter-spacing="3">ATTACK</text>
      </g>
    </g>

    <!-- ============ BOTTOM ROW: SERVE + EVENT ============ -->
    <g transform="translate(155,480)">
      <!-- SERVE -->
      <g>
        <rect x="0" y="0" width="380" height="130" rx="10" fill="url(#serveGrad)" stroke="#e0b23c" stroke-width="2.5"/>
        <rect x="140" y="15" width="100" height="65" rx="8" fill="none" stroke="#f3d47a" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="190" y="108" text-anchor="middle" fill="#f3d47a" font-size="22" font-weight="800" letter-spacing="6">發球區</text>
        <text x="190" y="122" text-anchor="middle" fill="#b89a4d" font-size="11" letter-spacing="3">SERVE</text>
      </g>
      <!-- EVENT -->
      <g transform="translate(396,0)">
        <rect x="0" y="0" width="494" height="130" rx="10" fill="url(#utilGrad)" stroke="#8a8378" stroke-width="2"/>
        <rect x="190" y="15" width="115" height="65" rx="8" fill="none" stroke="#c9c2b6" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="247" y="108" text-anchor="middle" fill="#c9c2b6" font-size="20" font-weight="800" letter-spacing="6">事件區</text>
        <text x="247" y="122" text-anchor="middle" fill="#8a8378" font-size="11" letter-spacing="3">EVENT</text>
      </g>
    </g>

    <!-- ============ TITLE / LOGO CORNERS ============ -->
    <g transform="translate(0,60)">
      <circle cx="65" cy="595" r="20" fill="none" stroke="#ff9d4d" stroke-width="2" filter="url(#softGlow)"/>
      <path d="M53 586 Q65 595 53 604 M77 586 Q65 595 77 604 M49 595 L81 595" stroke="#ff9d4d" stroke-width="1.4" fill="none"/>
      <text x="96" y="590" fill="#ffdcb0" font-size="17" font-weight="800" letter-spacing="2">排球卡牌對戰墊</text>
      <text x="96" y="605" fill="#7a746a" font-size="9" letter-spacing="1.5">VOLLEYBALL TCG · PLAYER MAT · FAN-MADE</text>
    </g>
    <g transform="translate(970,555)" opacity="0.85">
      <circle cx="30" cy="30" r="16" fill="none" stroke="#ff9d4d" stroke-width="1.8"/>
      <path d="M20 23 Q30 30 20 37 M40 23 Q30 30 40 37 M16 30 L44 30" stroke="#ff9d4d" stroke-width="1.2" fill="none"/>
      <text x="55" y="26" fill="#c9a679" font-size="12" font-weight="700" letter-spacing="1">HAIKYU!!</text>
      <text x="55" y="40" fill="#7a746a" font-size="9" letter-spacing="1">FAN-MADE PLAYMAT</text>
    </g>
  </g>
</svg>
